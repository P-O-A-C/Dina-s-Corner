<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17394d">
<title>GRAND DRY CLEAN | تسجيل دخول الإدارة</title>
<link rel="stylesheet" href="css/login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/config.js"></script>
</head>
<body data-page="public-login" data-login-project="grand-dry-clean" data-login-target="dashboard.html">
<main class="login-card">
  <section class="visual-panel">
    <div class="symbol">G</div><span>GRAND BUSINESS PORTAL</span>
    <h1>GRAND<br><em>DRY CLEAN</em></h1>
    <p>إدارة خدمات المغسلة والأصناف والأسعار.</p>
    <div class="visual-line"></div><small>CARE FOR EVERY FABRIC</small>
  </section>
  <section class="form-panel">
    <span class="eyebrow">MANAGEMENT ACCESS</span>
    <h2>تسجيل دخول الإدارة</h2>
    <p class="intro">استخدم حساب GRAND DRY CLEAN المخصص للوصول إلى لوحة الإدارة.</p>
    <form id="unifiedLoginForm" novalidate>
      <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
      <input id="username" name="username" autocomplete="username" placeholder="Username or email" required>
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button id="loginBtn" type="submit">دخول إلى لوحة المغسلة <span>←</span></button>
      <p id="msg" class="message" role="status" aria-live="polite" hidden></p>
    </form>
    <a class="customer-link" href="index.html">العودة إلى صفحة العملاء ↗</a>
    <footer><strong>GRAND DRY CLEAN</strong><span>POWERED BY POAC</span></footer>
  </section>
</main>
<script src="../assets/app.js?v=20261117-account-routing-v3"></script>
</body></html>
